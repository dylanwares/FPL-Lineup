# Local Postgres for development: `pnpm db:up`, then `pnpm db:migrate`.
# (Production is Neon; tests use in-process PGlite and need none of this.)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lineup
      POSTGRES_PASSWORD: lineup
      POSTGRES_DB: lineup
    ports:
      - "5432:5432"
    volumes:
      - lineup-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineup"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  lineup-pg:
