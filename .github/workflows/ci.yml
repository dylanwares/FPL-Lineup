name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fetches live FPL + projections data; needed by typecheck (manifest) and build.
      - run: pnpm data

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec prettier --check .
      - run: pnpm build

      # End-to-end planner flows against the production build (FPL is mocked).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: test-results
          if-no-files-found: ignore

      # Performance budgets (spec: planner JS < 150 KB gzip, LCP < 2.0 s on mobile).
      - run: pnpm size
      - run: pnpm lhci

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
