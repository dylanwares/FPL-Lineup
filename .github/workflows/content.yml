name: Content

# Pulls the latest FPL articles and videos into the Content tab's table.
# Needs the DATABASE_URL secret (Neon, pooled connection), migrated with `pnpm db:migrate`.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A slow run finishes before the next starts.
concurrency:
  group: content
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm content
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
